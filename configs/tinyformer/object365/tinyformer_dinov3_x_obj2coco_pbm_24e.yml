__include__: [
  '../../dataset/coco_detection.yml',
  '../../runtime.yml',
  '../../base/dataloader.yml',
  '../../base/optimizer.yml',
  '../../base/tinyformer.yml',
]


output_dir: ./outputs/tinyformer_dinov3_x_obj2coco_pbm_24e
  
DEIM:
  backbone: DINOv3SSAs_4Scale
  encoder: HybridEncoder_4Scale


DINOv3SSAs_4Scale:
  name: dinov3_vits16plus
  weights_path: ./ckpts/dinov3_vits16plus_pretrain_lvd1689m-4057cbaa.pth
  interaction_indexes: [5,8,11]   # only need the [1/8, 1/16, 1/32]
  finetune: True
  conv_inplane: 64
  hidden_dim: 256
  
HybridEncoder_4Scale:
  in_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  out_indices: [1, 2, 3]
  # intra
  hidden_dim: 256
  use_encoder_idx: [3]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.
  enc_act: 'gelu'


  # cross 
  expansion: 1.25
  depth_mult: 1.37
  act: 'silu'

  # New
  version: deim
  csp_type: csp2
  fuse_op: sum
  


DEIMTransformer:
  num_layers: 6
  eval_idx: -1
  feat_channels: [256, 256, 256]
  # reg_scale: 8
  hidden_dim: 256
  dim_feedforward: 2048

optimizer:
  type: AdamW
  params: 
    -
      # except norm/bn/bias in self.dinov3
      params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'  
      lr: 0.000005
    -
      # including norm/bn/bias in self.dinov3
      params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'    
      lr: 0.000005
      weight_decay: 0.
    - 
      # including norm/bn/bias except for the self.dinov3
      params: '^(?=.*(?:sda|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125




lrsheduler: flatcosine
lr_gamma: 1.0 #0.5
warmup_iter: 0 # 2000
flat_epoch: 12000 #24    # 4 + epoch // 2, e.g., 40 = 4 + 72 / 2
no_aug_epoch: 4
epoches: 24 # Early stop

ema:
  warmups: 0


## Dense O2O: Mosaic + Mixup + CopyBlend
train_dataloader: 
  dataset: 
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
          probability: 1.0, fill_value: 0, use_cache: True, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [2, 12, 20]   # list or int(for 365)
        ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']

  collate_fn:
    mixup_prob: 0.5
    copyblend_prob: 0.5
    mixup_epochs: [2, 12]
    copyblend_epochs: [2,20]
    base_size_repeat: 3
    stop_epoch: 20

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}


checkpoint_freq: 5
print_freq: 1000




# 3. 簡化 Loss Matcher (關閉動態切換)
DEIMCriterion:
  # 繼承原本的權重設定...
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['mal', 'boxes', 'local']
  gamma: 1.5
  alpha: 0.75
  reg_max: 32
  
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
    # [關鍵修改] 關閉動態切換
    change_matcher: False 
    # 下面這些參數在 change_matcher: False 時會自動失效，但為了乾淨可以不管它